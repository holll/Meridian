<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian — Emby 反代管理面板</title>
<meta name="description" content="Meridian 轻量级 Emby 反向代理管理面板">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1.34.0">
<link rel="stylesheet" href="/css/style.css?v=1.34.0">
</head>
<body>

<!-- Login Page -->
<div id="page-login">
  <div class="login-card">
    <div class="login-brand">
      <h1>Meridian</h1>
      <p>Emby 反代管理面板</p>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" class="form-input" id="inp-username" placeholder="admin" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" class="form-input" id="inp-password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <div class="form-group" id="setup-token-group" hidden>
        <label for="inp-setup-token">初始化令牌</label>
        <input type="password" class="form-input" id="inp-setup-token" autocomplete="off" placeholder="请从 Meridian 启动日志中复制">
        <div class="form-help">首次创建管理员时需要。令牌只会出现在服务启动日志中。</div>
      </div>
      <button type="submit" class="btn-login" id="btn-login">登录</button>
    </form>
    <div class="login-footer" id="login-footer">正在检查初始化状态...</div>
  </div>
</div>

<!-- Toast (outside app-shell for login-phase visibility) -->
<div id="toast-container"></div>

<!-- App Shell -->
<div id="app-shell">

  <!-- Top Navigation -->
  <nav class="topnav">
    <div class="topnav-brand"><img src="/favicon.svg" alt="" class="topnav-logo">Meridian</div>
    <div class="topnav-links">
      <a href="#dashboard" class="topnav-link active" data-page="dashboard">仪表盘</a>
      <a href="#sites" class="topnav-link" data-page="sites">站点管理</a>
      <a href="#access-logs" class="topnav-link" data-page="access-logs">访问日志</a>
      <a href="#access-analysis" class="topnav-link" data-page="access-analysis">日志分析</a>
      <a href="#relay" class="topnav-link" data-page="relay">节点管理</a>
      <a href="#diagnostics" class="topnav-link" data-page="diagnostics">故障诊断</a>
    </div>
    <div class="topnav-right">
      <div class="avatar-menu-wrap">
        <button class="avatar-btn" id="avatar-btn">A</button>
        <div class="avatar-menu" id="avatar-menu" aria-hidden="true">
          <button class="avatar-menu-item" id="menu-settings">设置</button>
          <button class="avatar-menu-item" id="menu-about">关于</button>
          <div class="avatar-menu-sep"></div>
          <button class="avatar-menu-item danger" id="menu-logout">退出登录</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Area -->
  <div class="main">
    <div id="page-dashboard" class="page active"></div>
    <div id="page-sites" class="page"></div>
    <div id="page-access-logs" class="page"></div>
    <div id="page-access-analysis" class="page"></div>
    <div id="page-relay" class="page"></div>
    <div id="page-diagnostics" class="page"></div>
  </div>

  <!-- Mobile Bottom Bar -->
  <nav class="mobile-bar">
    <div class="mobile-bar-inner">
      <a href="#dashboard" class="mobile-tab active" data-page="dashboard">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        仪表盘
      </a>
      <a href="#sites" class="mobile-tab" data-page="sites">
        <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        站点
      </a>
      <a href="#relay" class="mobile-tab" data-page="relay">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        节点
      </a>
      <button type="button" class="mobile-tab" id="btn-sidebar-open" aria-label="更多菜单">
        <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        更多
      </button>
    </div>
  </nav>

  <!-- Mobile Sidebar -->
  <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>
  <nav class="sidebar" id="sidebar" aria-label="导航菜单">
    <div class="sidebar-header">
      <img src="/favicon.svg" alt="" class="topnav-logo">Meridian
      <button type="button" class="sidebar-close" id="btn-sidebar-close" aria-label="关闭菜单">✕</button>
    </div>
    <div class="sidebar-links">
      <a href="#dashboard" class="sidebar-link" data-page="dashboard">仪表盘</a>
      <a href="#sites" class="sidebar-link" data-page="sites">站点管理</a>
      <a href="#access-logs" class="sidebar-link" data-page="access-logs">访问日志</a>
      <a href="#access-analysis" class="sidebar-link" data-page="access-analysis">日志分析</a>
      <a href="#relay" class="sidebar-link" data-page="relay">节点管理</a>
      <a href="#diagnostics" class="sidebar-link" data-page="diagnostics">故障诊断</a>
    </div>
    <div class="sidebar-footer">
      <button type="button" class="sidebar-link" id="btn-sidebar-logout">退出登录</button>
    </div>
  </nav>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay" aria-hidden="true">
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button type="button" class="modal-close" id="modal-close" aria-label="关闭弹窗">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>


</div>

<script src="/js/api.js?v=1.34.0"></script>
<script src="/js/toast.js?v=1.34.0"></script>
<script src="/js/router.js?v=1.34.0"></script>
<script src="/js/pages/dashboard.js?v=1.34.0"></script>
<script src="/js/pages/sites.js?v=1.34.0"></script>
<script src="/js/pages/access_logs.js?v=1.34.0"></script>
<script src="/js/pages/access_analysis.js?v=1.34.0"></script>
<script src="/js/pages/relay.js?v=1.34.0"></script>
<script src="/js/pages/diag.js?v=1.34.0"></script>
<script src="/js/app.js?v=1.34.0"></script>
</body>
</html>
