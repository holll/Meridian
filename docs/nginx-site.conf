# Meridian Nginx 反向代理配置
# 包含 Master（管理面板）和 Relay（流量节点）两份配置。
#
# 部署步骤（以 Master 为例）：
#   sudo cp docs/nginx-site.conf /etc/nginx/sites-available/meridian
#   sudo sed -i 's/panel.example.com/你的域名/g' /etc/nginx/sites-available/meridian
#   sudo ln -s /etc/nginx/sites-available/meridian /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL 证书申请（Certbot）：
#   sudo certbot --nginx -d panel.example.com

# WebSocket Connection 头按需切换
map $http_upgrade $connection_upgrade {
    default   '';
    websocket upgrade;
}

# ══════════════════════════════════════════════════════════════
#  MASTER — 管理面板  (panel.example.com)
# ══════════════════════════════════════════════════════════════

# HTTP → HTTPS 跳转
server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.example.com;

    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 建议：仅允许可信 IP 访问管理面板
    # allow 1.2.3.4;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_buffering       off;
        proxy_request_buffering off;

        client_max_body_size 10m;
    }
}

# ══════════════════════════════════════════════════════════════
#  RELAY — 流量节点  (relay-telecom.example.com)
#  每个 Relay 复制一份，修改 server_name 和 proxy_pass 端口即可
# ══════════════════════════════════════════════════════════════

# HTTP → HTTPS 跳转
server {
    listen 80;
    listen [::]:80;
    server_name relay-telecom.example.com;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name relay-telecom.example.com;

    # Relay 流量访问日志（包含响应时间、流量大小）
    access_log /var/log/nginx/relay-telecom-access.log combined;
    error_log  /var/log/nginx/relay-telecom-error.log warn;

    ssl_certificate     /etc/letsencrypt/live/relay-telecom.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay-telecom.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # 视频流：长超时 + 关闭缓冲
        proxy_read_timeout    7200s;
        proxy_send_timeout    7200s;
        proxy_buffering       off;
        proxy_request_buffering off;

        client_max_body_size 100m;
    }
}
