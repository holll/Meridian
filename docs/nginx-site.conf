# Meridian Nginx 反向代理配置
# 部署步骤：
#   sudo cp docs/nginx-site.conf /etc/nginx/sites-available/meridian
#   sudo sed -i 's/your-domain.com/你的域名/g' /etc/nginx/sites-available/meridian
#   sudo ln -s /etc/nginx/sites-available/meridian /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# ── Connection 头按需控制 ──────────────────────────────────────
# WebSocket 需要 Connection: upgrade，普通 HTTP 请求需要清空 Connection
# 以避免 hop-by-hop 头（如 Keep-Alive）被错误透传。
# 用 map 在 http 层根据 $http_upgrade 动态切换。
map $http_upgrade $connection_upgrade {
    default '';
    websocket upgrade;
}

# ── Server ─────────────────────────────────────────────────────

server {
    listen 80;
    server_name your-domain.com;

    # HTTPS（Certbot 会自动填充证书路径）
    # listen 443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;

    # TRUSTED_PROXY_CIDRS — 如果 Nginx 和 Meridian 在同一台机器用 127.0.0.1
    # 反代，则无需设置；跨机器部署时把 Nginx IP 加入该变量（见 README）。

    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;

        # 转发客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket：仅在客户端发起 Upgrade 时写 upgrade，否则清空
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # ── Range / 断点续传 / 视频拖拽 ──────────────────────
        # 显式透传 Range 和 If-Range——这些不是 hop-by-hop 头，
        # Nginx 默认就会转发，但为可读性写清楚。
        #   Range     → 请求部分字节（拖动进度条）
        #   If-Range  → 条件范围请求（断点恢复，避免 ETag 变化后
        #                返回损坏的分片）
        # 不开启 proxy_force_ranges，由上游 Emby 自行决定 206/200。

        # 超时（SSE 长连接 + 视频流需要）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 关闭缓冲让 SSE / 流媒体实时转发
        proxy_buffering off;
        proxy_request_buffering off;

        # 上传限制
        client_max_body_size 100m;
    }
}

# HTTP → HTTPS 自动跳转（启用 SSL 后取消注释）
